<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🌍 Country Explorer</h1>
            <p class="subtitle">Discover facts about countries around the world</p>
        </header>

        <!-- Search and Filter Section -->
        <div class="controls">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search countries by name..."
                    class="search-input"
                >
            </div>
            <div class="filter-box">
                <select id="regionFilter" class="region-filter">
                    <option value="">All Regions</option>
                    <option value="Africa">Africa</option>
                    <option value="Americas">Americas</option>
                    <option value="Asia">Asia</option>
                    <option value="Europe">Europe</option>
                    <option value="Oceania">Oceania</option>
                </select>
            </div>
        </div>

        <!-- Stats Section -->
        <div class="stats">
            <div class="stat-item">
                <span class="stat-number" id="totalCountries">0</span>
                <span class="stat-label">Total Countries</span>
            </div>
        </div>

        <!-- Countries Grid -->
        <div id="country-cards-container" class="countries-grid">
            <!-- Country cards will be inserted here -->
        </div>

        <!-- No Results Message -->
        <div id="noResults" class="no-results" style="display: none;">
            <p>No countries found matching your criteria.</p>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
